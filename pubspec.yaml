name: icicles_dsp
description: >-
  Native audio analysis for icicles animations over dart:ffi: Beat This! beat
  and downbeat tracking (beat-this, rten) and the icicles_generators audio
  feature matrix, computed in a Rust crate built by Dart build hooks.
version: 0.1.0
publish_to: "none"
repository: https://github.com/led-icicles/icicles_dsp

environment:
  sdk: ^3.13.0

dependencies:
  code_assets: ^2.0.0
  ffi: ^2.1.4
  hooks: ^2.1.0
  icicles_generators:
    git:
      url: git@github.com:led-icicles/icicles_generators.git
      ref: v0.6.0
  logging: ^1.3.0
  native_toolchain_rust: ^1.0.7

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  test: ^1.28.0
