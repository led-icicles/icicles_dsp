# Run with `fvm dart run ffigen --config ffigen.yaml`.
name: IciclesDspBindings
description: |
  Bindings for `rust/include/icicles_dsp.h` (the C ABI of the Rust crate).

  Regenerate bindings with `fvm dart run ffigen --config ffigen.yaml`.
output: 'lib/src/icicles_dsp_bindings_generated.dart'
headers:
  entry-points:
    - 'rust/include/icicles_dsp.h'
  include-directives:
    - 'rust/include/icicles_dsp.h'
ffi-native:
  asset-id: 'package:icicles_dsp/src/icicles_dsp_bindings_generated.dart'
preamble: |
  // Generated by ffigen from rust/include/icicles_dsp.h; do not edit.
  // ignore_for_file: type=lint
comments:
  style: any
  length: full
