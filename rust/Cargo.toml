[package]
name = "icicles_dsp"
version = "0.8.0"
edition = "2021"
rust-version = "1.89"
description = "Native audio analysis for icicles animations: Beat This! beat tracking, ADTOF drum hits, BTC chords, Demucs stems, All-In-One song structure and the icicles_generators feature matrix behind a C ABI."
license = "MIT"
repository = "https://github.com/led-icicles/icicles_dsp"
publish = false

[lib]
name = "icicles_dsp"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1"
beat-this = { version = "1.1", default-features = false }
rten = "0.24"
rten-tensor = "0.24"
rubato = "3.0"
rustfft = "6"
ogg = "0.9"
rusty_vorbis = { version = "0.1.3", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "aiff", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac"] }

[dev-dependencies]
lewton = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
panic = "unwind"

# rten's float math is orders of magnitude slower unoptimized; keep the
# dependencies optimized even in dev/test builds (the crate itself stays at the
# debug opt-level for fast incremental builds).
[profile.dev.package."*"]
opt-level = 3

# A copy of rusty_vorbis that encodes on the calling thread when only one is
# available (wasm32-wasip1 has no threads); see vendor/rusty_vorbis/PATCHED.md.
[patch.crates-io]
rusty_vorbis = { path = "vendor/rusty_vorbis" }
